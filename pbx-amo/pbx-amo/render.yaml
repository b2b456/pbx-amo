services:
  - type: web
    name: pbx-amo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: AMO_DOMAIN
        sync: false
      - key: AMO_TOKEN
        sync: false
      - key: AMO_PIPELINE_ID
        sync: false
      - key: SIP_WSS_URL
        sync: false
      - key: SIP_DOMAIN
        sync: false
      - key: SIP_USER
        sync: false
      - key: SIP_PASS
        sync: false
      - key: SIP_DISPLAY_NAME
        sync: false
